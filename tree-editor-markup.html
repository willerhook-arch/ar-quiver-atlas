<div id="tree-editor" class="card tree-editor hidden">
<div class="tree-editor-head"><div><div class="eyebrow">BRAUER TREE / CUSTOM ALGEBRA</div><h2>一棵树，一整个模范畴</h2><p class="small">编辑树形、每个顶点的循环序和唯一异常顶点。边号 1,…,e 对应代数的简单模。</p></div><div><label for="tree-preset" class="small">起始树形</label><select id="tree-preset"><option value="line">三边直线 · 内部重数 2</option><option value="star">三边星形 · 中心重数 2</option><option value="fork">四边分叉 · 重数 1</option><option value="double">五边双分叉 · 重数 1</option></select></div></div>
<div class="tree-editor-grid">
<div class="tree-picture"><div id="tree-canvas"></div><div class="micro" id="tree-summary"></div><div class="tree-leaf-tools"><select id="tree-leaf-parent" aria-label="选择添加或删除叶子的顶点"></select><button id="tree-leaf-add">添加叶子</button><button id="tree-leaf-remove">删除此叶子</button></div><p class="micro">可从任意顶点添加叶子来构造树，也可直接编辑右侧端点。循环序字段使用边号。</p></div>
<div><div class="tree-step"><b>1</b> 连接哪些顶点</div><div class="tree-edge-scroll"><table class="tree-edge-inputs"><thead><tr><th>边</th><th>端点</th><th></th><th>端点</th></tr></thead><tbody id="tree-edge-table"></tbody></table></div><button id="tree-update">更新顶点与循环序</button><div class="micro">改名或重新连接后，先更新顶点。</div></div>
<div><div class="tree-step"><b>2</b> 各顶点的循环序</div><div id="tree-orders"></div><button id="tree-reset-order">恢复边号顺序</button><p class="micro">例如 3,1,2。循环移位等价；反向一般改变标号代数。</p></div>
<div><div class="tree-step"><b>3</b> 异常顶点与重数</div><div class="field"><label for="tree-exceptional">异常顶点</label><select id="tree-exceptional"></select></div><div class="field"><label for="tree-multiplicity">该顶点的重数 m</label><div class="number-row"><input id="tree-multiplicity" type="range" min="1" max="8" value="2"><output id="tree-multiplicity-value">2</output></div></div><p class="micro">其余重数为 1。m=1 时没有异常顶点；异常顶点也可以是叶子。</p><button id="tree-apply" class="tree-primary">计算完整 AR 图</button><button id="tree-cancel" class="hidden">取消计算</button><div id="tree-dirty" class="micro" aria-live="polite">尚未计算</div></div>
</div><div id="tree-error" class="tree-error" role="alert" hidden></div><div id="tree-progress" class="tree-progress" role="status" hidden></div>
<div class="tree-editor-foot"><span>浏览器资源范围：1–10 条边，1≤m≤8，总不可分解模数≤150。合法输入在范围内完整枚举。</span><div><button id="tree-export">导出树配置</button><label class="tree-file">导入配置<input type="file" id="tree-import" accept="application/json,.json"></label></div></div>
</div>
